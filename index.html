<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikra - Control de Stock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2744">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mikra Stock">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
    :root {
        --bg: #0f1b2e; --card: #162540; --card2: #1b2d4d; --input: #0f1e33; --border: #2a4a7f;
        --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
        --primary: #4facfe; --yellow: #facc15; --green: #22c55e; --red: #ef4444; --red2: #f87171;
        --mikra: #d070ff; --chaya: #ffaa44;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { min-height: 100dvh; }
    button { font-family: inherit; }
    .app { max-width: 720px; margin: 0 auto; padding-bottom: 120px; }

    /* Encabezado */
    .top { position: sticky; top: 0; z-index: 50; background: var(--card); border-bottom: 1px solid var(--border); padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
    .top-row { display: flex; align-items: center; gap: 8px; }
    .top h1 { flex: 1; margin: 0; font-size: 1.05em; font-weight: 800; color: var(--primary); white-space: nowrap; }
    .hbtn { flex: none; width: 38px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--text); font-size: 1.05em; cursor: pointer; }
    .hbtn.spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.74em; color: var(--text2); margin-top: 4px; line-height: 1.45; min-height: 1.1em; }
    .status b { color: var(--text); }
    .status .warn { color: var(--yellow); text-decoration: underline; cursor: pointer; }
    .status .err { color: var(--red); font-weight: 700; }
    .q { width: 100%; margin-top: 8px; padding: 11px 13px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--input); color: var(--text); font-size: 16px; outline: none; }
    .q:focus { border-color: var(--primary); }

    .spinner { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--yellow); animation: spin .7s linear infinite; vertical-align: -2px; }

    /* Lista de artículos */
    .lst { padding: 8px 10px; }
    .sub { font-size: 0.7em; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; margin: 6px 4px 6px; }
    .art { display: flex; align-items: center; gap: 11px; padding: 7px; border-radius: 12px; background: var(--card); border: 1px solid transparent; margin-bottom: 6px; cursor: pointer; }
    .art:active { border-color: var(--primary); }
    .art img, .ph { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex: none; background: var(--input); }
    .art-mid { flex: 1; min-width: 0; }
    .art-nom { font-weight: 700; font-size: 0.95em; line-height: 1.25; }
    .art-stk { font-size: 0.74em; color: var(--text2); margin-top: 2px; }
    .badge { flex: none; text-align: right; font-weight: 900; font-size: 1.2em; color: var(--yellow); font-variant-numeric: tabular-nums; padding-right: 4px; }
    .badge small { display: block; font-size: 0.5em; font-weight: 700; opacity: .7; text-transform: uppercase; }
    .badge.cero { color: var(--text3); }
    .empty { text-align: center; padding: 30px 14px; color: var(--text2); font-size: 0.9em; line-height: 1.5; }

    /* Detalle */
    .det { padding: 8px 10px; }
    .dhead { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
    .back { flex: none; width: 42px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--text); font-size: 1.15em; font-weight: 900; cursor: pointer; }
    .dhead img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; flex: none; }
    .dnom { font-weight: 800; font-size: 1em; line-height: 1.25; }
    .dtot { font-size: 0.8em; color: var(--yellow); font-weight: 800; margin-top: 3px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip { display: inline-flex; align-items: center; padding: 5px 11px 5px 5px; border-radius: 18px; border: 1px solid var(--border); background: transparent; color: #cbd5e1; font-size: 0.82em; font-weight: 700; cursor: pointer; }
    .chip.sinimg { padding-left: 11px; }
    .chip img, .chip .cph { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; margin-right: 6px; flex: none; background: var(--input); }
    .chip b { color: var(--yellow); margin-left: 5px; }
    .chip.cero { opacity: .55; }
    .chip.on { background: var(--primary); border-color: var(--primary); color: #0f1e33; opacity: 1; }
    .chip.on b { color: #0f1e33; }
    .chip.mas { border-style: dashed; color: var(--text2); padding-left: 11px; }

    table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .t th { font-size: 0.64em; text-transform: uppercase; letter-spacing: .3px; color: var(--text2); font-weight: 700; text-align: right; padding: 4px 5px; white-space: nowrap; }
    .t th:first-child, .t td:first-child { text-align: left; }
    .t td { padding: 7px 5px; text-align: right; font-size: 0.95em; border-top: 1px solid rgba(42,74,127,0.6); white-space: nowrap; }
    .t th:last-child, .t td:last-child { text-align: center; width: 64px; }
    .crow td { font-weight: 800; background: rgba(79,172,254,0.08); font-size: 0.88em; text-align: left !important; border-top: 2px solid var(--border); }
    .crow img { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; vertical-align: middle; margin-right: 8px; background: var(--input); }
    .row td:first-child { cursor: pointer; }
    .row.open td { background: rgba(79,172,254,0.14); }
    .row.edit td { background: rgba(250,204,21,0.08); }
    .row.edit td:first-child { box-shadow: inset 3px 0 var(--yellow); }
    .row.falta td:first-child { box-shadow: inset 3px 0 var(--red); }
    .tal { font-weight: 900; }
    .tal small { display: block; font-size: 0.62em; font-weight: 600; color: var(--text3); }
    .p { font-weight: 900; color: var(--yellow); }
    .p.cero { color: var(--text3); font-weight: 600; }
    .e { color: #cbd5e1; }
    .e.neg { color: var(--red); font-weight: 900; }
    .arrow { display: block; font-size: 0.78em; font-weight: 900; }
    .arrow.up { color: var(--green); }
    .arrow.dn { color: var(--red2); }
    .s { font-weight: 800; color: var(--green); }
    .falta-t { color: var(--red2); font-weight: 900; font-size: 0.8em; white-space: normal; }
    .real { width: 56px; height: 40px; text-align: center; border-radius: 9px; border: 1.5px solid var(--border); background: var(--input); color: var(--yellow); font-size: 17px; font-weight: 900; outline: none; padding: 0; }
    .real:focus { border-color: var(--yellow); background: #1e3a5f; }
    .real:disabled { opacity: .35; }
    .trow td { font-weight: 900; font-size: 0.85em; color: var(--text); border-top: 1px dashed var(--border); }
    .vrow td { padding: 2px 4px 10px; background: rgba(15,30,51,0.6); text-align: left !important; white-space: normal; }
    .venta { display: block; padding: 8px 10px; border-radius: 9px; margin-top: 6px; background: rgba(255,255,255,0.05); color: var(--text); text-decoration: none; border-left: 3px solid var(--primary); }
    .venta.vista { opacity: .5; border-left-color: var(--green); }
    .v1 { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 0.82em; }
    .v1 b { margin-right: 2px; }
    .v2 { font-size: 0.75em; color: var(--text2); margin-top: 3px; }
    .tag { font-size: 0.85em; font-weight: 800; padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
    .tag.uds { background: rgba(250,204,21,0.2); color: var(--yellow); }
    .tag.mikra { background: rgba(156,39,176,0.25); color: var(--mikra); }
    .tag.chaya { background: rgba(255,107,0,0.25); color: var(--chaya); }
    .tag.flex { background: rgba(250,204,21,0.15); color: #fde68a; }
    .tag.colecta { background: rgba(79,172,254,0.2); color: var(--primary); }
    .tag.otro { background: rgba(56,189,248,0.2); color: #7dd3fc; }
    .tag.pack { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px dashed rgba(245,158,11,0.45); }
    .legend { font-size: 0.74em; color: var(--text2); margin: 12px 4px 0; line-height: 1.55; }

    /* Pie: ajustes listos */
    .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: none; align-items: center; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #0b1626; border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,0.4); }
    .foot.show { display: flex; }
    .foot-in { max-width: 720px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 8px; }
    .ftxt { flex: 1; min-width: 0; font-size: 0.85em; font-weight: 800; color: var(--yellow); line-height: 1.3; }
    .ftxt small { display: block; color: var(--text2); font-weight: 600; font-size: 0.82em; }
    .fbtn { flex: none; border: none; border-radius: 11px; padding: 12px 15px; font-weight: 900; font-size: 0.95em; cursor: pointer; background: var(--green); color: #052e16; }
    .fbtn.sec { background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid var(--border); }

    /* Avisos */
    .toasts { position: fixed; left: 0; right: 0; bottom: 84px; z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
    .toast { max-width: 520px; width: 100%; padding: 10px 13px; border-radius: 11px; background: #1e293b; border: 1px solid var(--border); font-size: 0.85em; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,0.45); transition: opacity .3s; }
    .toast.ok { border-color: var(--green); color: #86efac; }
    .toast.err { border-color: var(--red); color: #fca5a5; }
</style>
</head>
<body>
<div class="app">
    <div class="top">
        <div class="top-row">
            <h1>📋 Control de Stock</h1>
            <button class="hbtn" id="btnRefresh" title="Volver a traer las ventas y el stock de Ecom">🔄</button>
        </div>
        <div class="status" id="status"></div>
        <input class="q" id="q" type="search" placeholder="🔍 Buscar artículo (ej: calza oxford)" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="lst" id="lst"></div>
    <div class="det" id="det" style="display:none"></div>
</div>
<div class="foot" id="foot">
    <div class="foot-in">
        <div class="ftxt" id="ftxt"></div>
        <button class="fbtn sec" id="fDesc">Descartar</button>
        <button class="fbtn" id="fSend">✅ Enviar</button>
    </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONTROL DE STOCK (celular) — misma lógica que el panel "📋 Sin imprimir por artículo"
// del script ML Ventas — Ubicaciones y Stock.
//   Sin imp. = ventas ML pendientes (sin imprimir + "para otro día", Flex y Colecta) de Mikra y Chaya,
//              con los packs descompuestos en sus prendas.
//   Ecom     = stock de Ecom en vivo (ya descontó esas ventas).
//   Estante  = Ecom + sin imprimir (lo que debería haber físicamente).
//   Real     = lo que contaste → Ecom pasa a (real − sin imprimir), enviado con motivo "Ajuste manual".
// ═══════════════════════════════════════════════════════════════════════
const API_URL = 'https://mikra-stock-cache.rafaelassir.workers.dev';
const WORKER = 'https://ecomm-token-proxy.rafaelassir.workers.dev';
const ML_PROXIES = { Mikra: 'https://mikra-flex-proxy.rafaelassir.workers.dev', Chaya: 'https://chaya-flex-proxy.rafaelassir.workers.dev' };
const ML_VENTA_URL = id => 'https://vendedores.mercadolibre.com.ar/ventas/' + encodeURIComponent(id) + '/detalle';
const ML_TOKEN_TTL = 55 * 60 * 1000;
const SI_SUBST = ['ready_to_print', 'invoice_pending', 'buffered'];   // 'waiting_for_capacity' NO filtra en orders/search
const SI_MAX_FILTRO = 3000;
const SI_TTL = 3 * 60 * 1000;
const SUBST_SIN_IMPRIMIR = ['ready_to_print', 'invoice_pending', 'printing', 'ready_for_pkg_creation'];
const SUBST_OTRO_DIA = ['buffered', 'waiting_for_capacity'];
const SUBST_PENDIENTE = [...SUBST_SIN_IMPRIMIR, ...SUBST_OTRO_DIA];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function talleOrder(t) {
    const s = (t || '').toUpperCase().trim();
    const m = { XS: 50, S: 51, M: 52, L: 53, XL: 54, XXL: 55, '2XL': 55, XXXL: 56, '3XL': 56, '4XL': 57, '5XL': 58 };
    if (m[s] !== undefined) return m[s];
    const n = parseFloat(s); return isNaN(n) ? 999 : n;
}
const TZ = 'America/Argentina/Buenos_Aires';
const fmtHora = new Intl.DateTimeFormat('es-AR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtDiaMes = new Intl.DateTimeFormat('es-AR', { timeZone: TZ, day: 'numeric', month: 'short' });
const fmtISO = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
function fmtFecha(iso) {
    const d = iso ? new Date(iso) : null;
    if (!d || isNaN(d)) return '';
    const hoy = fmtISO.format(new Date()), ayer = fmtISO.format(new Date(Date.now() - 864e5)), dd = fmtISO.format(d);
    return (dd === hoy ? 'Hoy' : dd === ayer ? 'Ayer' : fmtDiaMes.format(d).replace(/\./g, '')) + ' ' + fmtHora.format(d);
}

// ── Estado ──
let skuData = {}, packIndex = {}, artList = [];
let catalogoOk = false, catalogoErr = '';
const mlTokens = {};
let _filas = null, _ts = 0, _err = [], _data = null, _loading = null;
const _ship = new Map(), _shipReq = new Set();
const _ecom = {}, _ecomTs = {}, _ecomReq = new Set();
const _real = {}, _enviando = new Set(), _vistas = new Set();
let _art = null, _color = null, _open = null, _query = '', _verDesc = false, _verSin = false;

// ── Catálogo (artículos, colores, talles, fotos y packs) ──
async function fetchJSON(url, ms) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 30000);
    try {
        const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
    } finally { clearTimeout(t); }
}
async function cargarCatalogo() {
    for (let i = 0; i < 3; i++) {
        try {
            const [d, im, pk] = await Promise.all([
                fetchJSON(API_URL, 30000),
                fetchJSON(API_URL + '?mode=images', 30000).catch(() => ({})),
                fetchJSON(API_URL + '?mode=packs', 20000).catch(() => ({})),
            ]);
            if (!d.success || !d.products || !d.products.length) throw new Error('catálogo vacío');
            const imgs = (im && im.images) || {};
            const sd = {};
            d.products.forEach(p => {
                if (!p.codigo) return;
                const s = String(p.codigo);
                sd[s] = { nombre: p.articulo || p.titulo || '', color: p.color || '', talle: p.talle || '',
                    s: (p.stock !== undefined && p.stock !== null) ? Number(p.stock) : 0, img: imgs[s] || '' };
            });
            // foto por artículo+color para las variantes que no tienen
            const porColor = {};
            for (const s in sd) { const x = sd[s]; if (x.img) { const k = x.nombre + '|' + x.color; if (!porColor[k]) porColor[k] = x.img; } }
            for (const s in sd) { const x = sd[s]; if (!x.img) x.img = porColor[x.nombre + '|' + x.color] || ''; }
            skuData = sd;
            packIndex = (pk && pk.success && pk.packs) ? pk.packs : {};
            armarArticulos();
            catalogoOk = true; catalogoErr = '';
            return;
        } catch (e) {
            catalogoErr = e.name === 'AbortError' ? 'tardó demasiado' : e.message;
            await new Promise(r => setTimeout(r, 1500 * (i + 1)));
        }
    }
    throw new Error('No se pudo bajar el catálogo (' + catalogoErr + ')');
}
// Artículos para buscar (sin los packs: un nombre es pack si alguna variante está registrada como combo)
function armarArticulos() {
    const packNoms = new Set();
    for (const s in skuData) if (packIndex[s] && skuData[s].nombre) packNoms.add(skuData[s].nombre);
    const m = new Map();
    for (const s in skuData) {
        const d = skuData[s]; if (!d.nombre || packNoms.has(d.nombre)) continue;
        let a = m.get(d.nombre);
        if (!a) { a = { nombre: d.nombre, total: 0, img: '', _n: norm(d.nombre) }; m.set(d.nombre, a); }
        a.total += d.s || 0;
        if (!a.img && d.img) a.img = d.img;
    }
    artList = [...m.values()].sort((x, y) => y.total - x.total);
}
const artInfo = n => artList.find(a => a.nombre === n);
function imgColor(skus, color) { for (const s of skus) { const d = skuData[s]; if ((d.color || '—') === color && d.img) return d.img; } return ''; }

// ── Mercado Libre: ventas pendientes de Mikra y Chaya ──
async function getMLToken(proxy) {
    const c = mlTokens[proxy];
    if (c && Date.now() < c.expiresAt) return c;
    const r = await fetch(proxy + '/get-token', { cache: 'no-store' });
    const d = await r.json();
    const info = { token: d.access_token, userId: d.user_id, expiresAt: Date.now() + ML_TOKEN_TTL };
    mlTokens[proxy] = info;
    return info;
}
async function fetchML(proxy, path) {
    for (let i = 0; i < 2; i++) {
        const { token } = await getMLToken(proxy);
        const r = await fetch(proxy + path, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
        if ((r.status === 401 || r.status === 403) && i === 0) { delete mlTokens[proxy]; continue; }
        if (!r.ok) throw new Error('ML ' + r.status);
        return r.json();
    }
}
function esImpreso(substatus, status) {   // true = ya no está pendiente · false = pendiente · null = no se sabe
    if (status && !['ready_to_ship', 'pending', 'handling'].includes(status)) return true;
    if (!substatus) return null;
    return !SUBST_PENDIENTE.includes(substatus);
}
async function cargarCuenta(cuenta, proxy) {
    const { userId } = await getMLToken(proxy);
    const orders = new Map(); let ok = 0;
    await Promise.all(SI_SUBST.map(async sub => {
        const url = off => `/api/orders/search?seller=${userId}&shipping.substatus=${sub}&sort=date_desc&limit=50&offset=${off}&_ts=${Date.now()}`;
        const agregar = d => (d.results || []).forEach(o => {
            if (o && o.status !== 'cancelled' && o.shipping && o.shipping.id && !orders.has(o.id)) orders.set(o.id, { o, cuenta, proxy, sub });
        });
        let d;
        try { d = await fetchML(proxy, url(0)); ok++; } catch (e) { return; }
        const totalML = Number(d.paging && d.paging.total) || 0;
        if (totalML > SI_MAX_FILTRO) return;   // ML ignoró el filtro
        agregar(d);
        const total = Math.min(totalML, 1000), offs = [];
        for (let off = 50; off < total; off += 50) offs.push(off);
        await Promise.all(offs.map(off => fetchML(proxy, url(off)).then(agregar).catch(() => {})));
    }));
    if (!ok) throw new Error('sin respuesta de ML');
    return [...orders.values()];
}
// Agrupa por SKU (packs descompuestos). Si ya se pidió el envío, manda su estado real.
function agregar() {
    const porSku = new Map(), desconocidos = []; let nVentas = 0;
    const add = (sku, u, v) => { let e = porSku.get(sku); if (!e) { e = { u: 0, ventas: [] }; porSku.set(sku, e); } e.u += u; e.ventas.push({ ...v, u }); };
    (_filas || []).forEach(({ o, cuenta, proxy, sub }) => {
        const sid = o.shipping.id, s = _ship.get(sid) || null;
        if (s && esImpreso(s.substatus || null, s.status || null) !== false) return;
        nVentas++;
        const base = { vid: String(o.pack_id || o.id), cuenta, proxy, sid, nick: (o.buyer && o.buyer.nickname) || '', fecha: o.date_created || '',
            flex: s ? s.logistic_type === 'self_service' : null,
            otroDia: SUBST_OTRO_DIA.includes(s ? s.substatus : sub),
            fechaLimite: (s && s.shipping_option && s.shipping_option.buffering && s.shipping_option.buffering.date) || null };
        (o.order_items || []).forEach(it => {
            const sku = String((it.item && (it.item.seller_sku || it.item.seller_custom_field)) || '').trim();
            const q = Number(it.quantity) || 1;
            const comps = sku && packIndex[sku];
            if (comps && comps.length) {
                const cnt = {}; comps.forEach(c => { cnt[c] = (cnt[c] || 0) + 1; });
                for (const c in cnt) {
                    if (skuData[c]) add(c, cnt[c] * q, { ...base, pack: sku });
                    else desconocidos.push({ ...base, u: cnt[c] * q, sku: c, titulo: ((it.item && it.item.title) || '') + ' (componente de pack ' + sku + ')' });
                }
            } else if (sku && skuData[sku]) add(sku, q, { ...base, pack: null });
